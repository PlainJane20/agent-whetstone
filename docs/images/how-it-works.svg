<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">How Whetstone works</title>
  <desc id="d">An attacker agent sends synthetic injection attacks at a target agent, by default a simulated gullible agent, optionally a real model. Input screening and spotlighting sit in front of it, and a tool policy and egress filter guard what it does inside a sandbox with fake tools and fake canary secrets. A deterministic oracle scores the outcome. The score feeds a defender that proposes new screening rules, and every attempt lands in a hash-chained audit log.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#be123c"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="20" fill="#f8fafc"/>

  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">How Whetstone works</text>
  <text x="600" y="74" text-anchor="middle" font-size="15" fill="#475569">Attackers and defenders spar around a target agent. A deterministic oracle keeps score.</text>

  <!-- ROW 1 -->
  <g filter="url(#sh)"><rect x="36" y="100" width="250" height="140" rx="14" fill="#ffffff" stroke="#e11d48" stroke-width="2.5"/></g>
  <text x="161" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#be123c" letter-spacing="1.5">1  THE ATTACKER</text>
  <text x="161" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Sends attacks</text>
  <text x="161" y="188" text-anchor="middle" font-size="13" fill="#334155">11 technique families x 5</text>
  <text x="161" y="207" text-anchor="middle" font-size="13" fill="#334155">goals, scripted or mutating</text>
  <text x="161" y="228" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">benign payloads, sandbox only</text>
  <path d="M290 170H322" stroke="#be123c" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)"><rect x="326" y="100" width="250" height="140" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/></g>
  <text x="451" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" letter-spacing="1.5">2  THE FRONT DOOR</text>
  <text x="451" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Screen and wrap</text>
  <text x="451" y="188" text-anchor="middle" font-size="13" fill="#334155">decode, normalise, scan rules;</text>
  <text x="451" y="207" text-anchor="middle" font-size="13" fill="#334155">random delimiters (spotlight)</text>
  <text x="451" y="228" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">can block before the agent reads</text>
  <path d="M580 170H612" stroke="#be123c" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)"><rect x="616" y="100" width="250" height="140" rx="14" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/></g>
  <text x="741" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="1.5">3  THE TARGET</text>
  <text x="741" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Simulated or live agent</text>
  <text x="741" y="188" text-anchor="middle" font-size="13" fill="#334155">simulated: follows an author-set</text>
  <text x="741" y="207" text-anchor="middle" font-size="13" fill="#334155">susceptibility profile; live: a real LLM</text>
  <text x="741" y="228" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">default: a simulation; or a real LLM</text>
  <path d="M870 170H902" stroke="#be123c" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)"><rect x="906" y="100" width="250" height="140" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/></g>
  <text x="1031" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.5">4  THE SANDBOX</text>
  <text x="1031" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Fake world</text>
  <text x="1031" y="188" text-anchor="middle" font-size="13" fill="#334155">synthetic inbox, fake tools,</text>
  <text x="1031" y="207" text-anchor="middle" font-size="13" fill="#334155">fake CANARY secrets</text>
  <text x="1031" y="228" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">policy + egress guard each call</text>
  <path d="M1031 244V288" stroke="#be123c" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- ROW 2 (right to left) -->
  <g filter="url(#sh)"><rect x="906" y="292" width="250" height="140" rx="14" fill="#ffffff" stroke="#e11d48" stroke-width="2.5"/></g>
  <text x="1031" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#be123c" letter-spacing="1.5">5  THE ORACLE</text>
  <text x="1031" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Decides, no LLM judge</text>
  <text x="1031" y="374" text-anchor="middle" font-size="13" fill="#334155">canary out? forbidden call?</text>
  <text x="1031" y="392" text-anchor="middle" font-size="13" fill="#334155">mass delete? external send?</text>
  <text x="1031" y="418" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">same input, same verdict</text>
  <path d="M902 362H870" stroke="#be123c" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)"><rect x="616" y="292" width="250" height="140" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/></g>
  <text x="741" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.5">6  THE SCORE</text>
  <rect x="636" y="332" width="210" height="26" rx="13" fill="#fee2e2" stroke="#dc2626"/>
  <text x="741" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">attack success rate (ASR)</text>
  <rect x="636" y="364" width="210" height="26" rx="13" fill="#fef3c7" stroke="#d97706"/>
  <text x="741" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">false positives on benign</text>
  <rect x="636" y="396" width="210" height="26" rx="13" fill="#dcfce7" stroke="#16a34a"/>
  <text x="741" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">canary leak, latency</text>
  <path d="M612 362H580" stroke="#be123c" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)"><rect x="326" y="292" width="250" height="140" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/></g>
  <text x="451" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="1.5">7  THE DEFENDER</text>
  <text x="451" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Proposes rules</text>
  <text x="451" y="374" text-anchor="middle" font-size="13" fill="#334155">n-grams from attacks that won,</text>
  <text x="451" y="392" text-anchor="middle" font-size="13" fill="#334155">checked on held-out benign mail</text>
  <text x="451" y="418" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">versioned rule set, offline</text>
  <path d="M322 362H290" stroke="#be123c" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M451 288V244" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)"/>
  <text x="463" y="270" font-size="12" font-style="italic" fill="#5b21b6">new rules</text>

  <g filter="url(#sh)"><rect x="36" y="292" width="250" height="140" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/></g>
  <text x="161" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.5">8  THE RECORD</text>
  <text x="161" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Audit and traces</text>
  <text x="161" y="374" text-anchor="middle" font-size="13" fill="#334155">hash-chained log of every</text>
  <text x="161" y="392" text-anchor="middle" font-size="13" fill="#334155">attempt, replayable; OTel spans</text>
  <text x="161" y="418" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">tamper-evident, not tamper-proof</text>

  <!-- BANNER OF SCOPE -->
  <rect x="36" y="470" width="1120" height="130" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="60" y="502" font-size="13" font-weight="700" fill="#be123c" letter-spacing="1.5">DEFENSIVE SCOPE</text>
  <text x="60" y="530" font-size="15" fill="#334155">Attacks only ever touch this project's own SIMULATED sandbox: synthetic emails, fake tools, fake canary strings.</text>
  <text x="60" y="552" font-size="15" fill="#334155">Payloads are generic and benign (make a fake tool call, reveal a fake string). No real service is targeted.</text>
  <text x="60" y="574" font-size="15" fill="#334155">The default target is a simulation, not an LLM; real-model runs (Haiku 4.5) are reported separately.</text>
  <text x="60" y="592" font-size="13" font-style="italic" fill="#64748b">Do not point any of this at a system you do not own.</text>
</svg>
