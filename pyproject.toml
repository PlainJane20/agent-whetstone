[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-whetstone"
version = "0.1.0"
description = "A sparring partner for AI agents: sandboxed prompt-injection and data-exfiltration attacks, defenses, and honest attack-success measurement (simulated sandbox, offline)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Navi Sohi" }]
dependencies = [
  "opentelemetry-api>=1.20",
]

[project.optional-dependencies]
# LLMTarget only. Built and tested with pydantic-ai's TestModel, never run live here.
llm = ["pydantic-ai-slim[anthropic]>=1.0"]
dev = [
  "pytest>=8",
  "opentelemetry-sdk>=1.20",
  "pydantic-ai-slim[anthropic]>=1.0",
]

[project.scripts]
whetstone = "whetstone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
